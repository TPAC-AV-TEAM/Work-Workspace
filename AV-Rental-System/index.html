    <!-- iOS / Android Web App 專用設定 -->

    <style>
        :root {
            /* macOS Dark Theme 色彩系統 */
            --mac-bg: #1e1e1e;
            --mac-card-bg: rgba(38, 38, 41, 0.75);
            --mac-card-border: rgba(255, 255, 255, 0.12);
            --mac-card-hover: rgba(50, 50, 54, 0.85);
            --mac-accent: #0a84ff; /* Apple System Blue */
            --mac-accent-glow: rgba(10, 132, 255, 0.25);
            --mac-text-primary: #f5f5f7;
            --mac-text-secondary: #a1a1a6;
            --mac-badge-bg: rgba(255, 255, 255, 0.08);
            
            /* 金額亮點色彩 (Blue) */
            --mac-price-bg: rgba(10, 132, 255, 0.18);
            --mac-price-border: rgba(10, 132, 255, 0.4);
            
            /* 數量亮點色彩 (Yellow/Gold) */
            --mac-qty-bg: rgba(255, 214, 10, 0.18);
            --mac-qty-border: rgba(255, 214, 10, 0.45);
            --mac-qty-text: #ffd60a;

            /* 異常警示色彩 (Orange/Red) */
            --mac-warning: #ff9f0a;
            --mac-warning-bg: rgba(255, 159, 10, 0.2);
            --mac-warning-border: rgba(255, 159, 10, 0.5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--mac-bg);
            color: var(--mac-text-primary);
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 100vh;
        }

        /* 固定頂部導航列 */
        .mac-nav {
            position: sticky;
            top: 0;
            background: rgba(30, 30, 30, 0.82);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 12px 16px 14px 16px;
            border-bottom: 1px solid var(--mac-card-border);
            z-index: 999;
        }

        .mac-window-controls {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 12px;
        }

        .mac-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f57; border: 1px solid #e0443e; }
        .dot-yellow { background-color: #febc2e; border: 1px solid #d8a124; }
        .dot-green { background-color: #28c840; border: 1px solid #1aab29; }
        
        .mac-app-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--mac-text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 6px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 12px 36px 12px 38px;
            font-size: 15px;
            color: var(--mac-text-primary);
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--mac-card-border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .search-input::placeholder {
            color: var(--mac-text-secondary);
            font-size: 14px;
        }

        .search-input:focus {
            border-color: var(--mac-accent);
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px var(--mac-accent-glow), inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--mac-text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stats-bar {
            margin-top: 10px;
            font-size: 12px;
            color: var(--mac-text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2px;
        }

        /* 主容器 */
        .app-container {
            padding: 14px 14px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* macOS 卡片元件 */
        .mac-card {
            background: var(--mac-card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid var(--mac-card-border);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }

        .mac-card:active {
            transform: scale(0.985);
            background-color: var(--mac-card-hover);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 10px;
        }

        .item-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--mac-text-primary);
            line-height: 1.35;
            letter-spacing: -0.2px;
            flex: 1;
        }

        .key-metrics {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .metric-badge {
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 13.5px;
            white-space: nowrap;
            letter-spacing: -0.3px;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .qty-badge {
            background-color: var(--mac-qty-bg);
            color: var(--mac-qty-text);
            border: 1px solid var(--mac-qty-border);
        }

        .qty-badge-warning {
            background-color: var(--mac-warning-bg);
            color: var(--mac-warning);
            border: 1px solid var(--mac-warning-border);
        }

        .price-badge {
            background-color: var(--mac-price-bg);
            color: var(--mac-accent);
            border: 1px solid var(--mac-price-border);
        }

        .tag-group {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 6px 0 8px 0;
        }

        .mac-badge {
            font-size: 11.5px;
            padding: 3px 8px;
            border-radius: 6px;
            background-color: var(--mac-badge-bg);
            color: var(--mac-text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .badge-venue {
            color: #64d2ff;
            background-color: rgba(100, 210, 255, 0.1);
        }

        .remark-drawer {
            margin-top: 10px;
            padding-top: 9px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
            color: var(--mac-text-secondary);
            line-height: 1.45;
        }

        .warning-tag {
            color: var(--mac-warning);
            background-color: var(--mac-warning-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            display: inline-block;
            margin-top: 2px;
        }

        .no-result {
            text-align: center;
            padding: 60px 20px;
            color: var(--mac-text-secondary);
        }

        .no-result-icon {
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.8;
        }

        @media (max-width: 380px) {
            .card-top { flex-direction: column; gap: 8px; }
            .key-metrics { width: 100%; justify-content: flex-start; }
            .metric-badge { font-size: 12.5px; padding: 4px 8px; }
        }

// 正則特殊符號跳脫
function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 移除空格、底線、連字號等常見分隔符號（用於型號比對）
function normalizeModelText(text) {
    if (!text) return '';
    return text.toLowerCase().replace(/[\s\-_/\\()（）.,:;+]/g, '');
}

// 單一關鍵字比對邏輯
function matchSingleToken(token, textToSearch, normalizedTarget) {
    const rawToken = token.trim();
    if (!rawToken) return true;

    // 1. 若為極短英數字詞 (長度 <= 2，例如 DI、GT、GP、BB)，嚴格要求「獨立單詞邊界」
    // 使用 Lookbehind / Lookahead 避免命中 Audio 或 Digital
    if (/^[a-zA-Z0-9]{1,2}$/i.test(rawToken)) {
        const regex = new RegExp(`(?<![a-zA-Z0-9])${escapeRegExp(rawToken)}(?![a-zA-Z0-9])`, 'i');
        return regex.test(textToSearch);
    }

    // 2. 正常詞彙：先比對原始內容是否包含
    if (textToSearch.toLowerCase().includes(rawToken.toLowerCase())) {
        return true;
    }

    // 3. 型號容錯比對 (例如輸入 SM58 或 SM-58 比對 SM 58)
    const normToken = normalizeModelText(rawToken);
    return normToken.length > 0 && normalizedTarget.includes(normToken);
}

// 智慧型號容錯與搜尋演算法
function performSearch() {
    const searchInput = document.getElementById('searchInput');
    const rawQuery = searchInput.value.trim();
    const clearBtn = document.getElementById('clearBtn');
    
    clearBtn.style.display = rawQuery.length > 0 ? 'flex' : 'none';

    if (!rawQuery) {
        renderResults(equipmentData);
        return;
    }

    const tokens = rawQuery.split(/\s+/).filter(t => t.length > 0);

    const filtered = equipmentData.filter(item => {
        const textToSearch = `${item.name} ${item.venue} ${item.remark}`;
        const normalizedTarget = normalizeModelText(textToSearch);

        // 情況 A：如果是單一簡短代號 (長度 <= 2，例如純輸入 DI)
        // 直接走嚴格單詞邊界比對，不走全文無空格模糊匹配
        if (tokens.length === 1 && /^[a-zA-Z0-9]{1,2}$/i.test(tokens[0])) {
            return matchSingleToken(tokens[0], textToSearch, normalizedTarget);
        }

        // 情況 B：型號容錯（例如使用者輸入 "SM 58", "SM-58", "M32 R" 等連續型號）
        // 若使用者輸入包含分隔符號，優先嘗試將整串去符號比對
        const fullNormalizedQuery = normalizeModelText(rawQuery);
        if (fullNormalizedQuery.length > 2 && normalizedTarget.includes(fullNormalizedQuery)) {
            return true;
        }

        // 情況 C：多關鍵字交集搜尋（例如 "大劇院 DI"、"MIPRO 麥克風"）
        return tokens.every(token => matchSingleToken(token, textToSearch, normalizedTarget));
    });

    renderResults(filtered);
}

// 渲染卡片結果至頁面
function renderResults(data) {
    const resultsContainer = document.getElementById('resultsList');
    const resultCount = document.getElementById('resultCount');

    resultCount.textContent = `${data.length} 項設備`;

    if (data.length === 0) {
        resultsContainer.innerHTML = `
            <div class="no-result">
                <div class="no-result-icon">💻</div>
                <div style="font-size: 15px; font-weight: 500;">未找到符合的設備</div>
                <div style="font-size: 12px; margin-top: 6px; opacity: 0.6;">請嘗試搜尋其他關鍵字或簡寫</div>
            </div>
        `;
        return;
    }

    resultsContainer.innerHTML = data.map(item => {
        const isWarning = item.qty.includes("可用") || item.remark.includes("燒毀");
        const qtyBadgeClass = isWarning ? "metric-badge qty-badge-warning" : "metric-badge qty-badge";

        return `
        <div class="mac-card">
            <div class="card-top">
                <div class="item-title">${item.name}</div>
                <div class="key-metrics">
                    <div class="${qtyBadgeClass}">📦 ${item.qty}</div>
                    <div class="metric-badge price-badge">${item.price}</div>
                </div>
            </div>
            <div class="tag-group">
                <span class="mac-badge badge-venue">📍 ${item.venue}</span>
                <span class="mac-badge">計價單位: ${item.unit}</span>
            </div>
            <div class="remark-drawer">
                ${item.remark}
            </div>
        </div>
        `;
    }).join('');
}

// 清除按鈕
function clearSearch() {
    const searchInput = document.getElementById('searchInput');
    searchInput.value = '';
    performSearch();
    searchInput.focus();
}

// 監聽輸入事件
document.getElementById('searchInput').addEventListener('input', performSearch);

// 頁面初始化
performSearch();
</script>
