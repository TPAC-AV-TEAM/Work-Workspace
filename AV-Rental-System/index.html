            --mac-card-border: rgba(255, 255, 255, 0.12);
            --mac-card-hover: rgba(50, 50, 54, 0.85);
            --mac-accent: #0a84ff; /* Apple System Blue */
            --mac-accent-glow: rgba(10, 132, 255, 0.25);
            --mac-text-primary: #f5f5f7;
            --mac-text-secondary: #a1a1a6;
            --mac-badge-bg: rgba(255, 255, 255, 0.08);
            
            /* 表格邊框與底色 */
            --table-header-bg: #2c2c2e;
            --table-row-hover: rgba(255, 255, 255, 0.04);
            --table-border: rgba(255, 255, 255, 0.08);

            /* 數量與警示亮點色彩 */
            --mac-qty-text: #ffd60a;
            --mac-warning: #ff9f0a;
            --mac-warning-bg: rgba(255, 159, 10, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
            background-color: var(--mac-bg);
            color: var(--mac-text-primary);
            margin: 0;
            padding: 0;
            padding-bottom: 40px;
            padding-top: env(safe-area-inset-top);
            padding-left: env(safe-area-inset-left);
            padding-right: env(safe-area-inset-right);
            min-height: 100vh;
        }

        /* 固定頂部導航列 */
        .mac-nav {
            position: sticky;
            top: 0;
            background: rgba(30, 30, 30, 0.85);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            padding: 12px 20px 14px 20px;
            border-bottom: 1px solid var(--mac-card-border);
            z-index: 999;
        }

        .mac-window-controls {
            display: flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 12px;
        }

        .mac-dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
        }
        .dot-red { background-color: #ff5f57; border: 1px solid #e0443e; }
        .dot-yellow { background-color: #febc2e; border: 1px solid #d8a124; }
        .dot-green { background-color: #28c840; border: 1px solid #1aab29; }
        
        .mac-app-title {
            font-size: 11px;
            font-weight: 600;
            color: var(--mac-text-secondary);
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-left: 6px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
            max-width: 600px;
        }

        .search-input {
            width: 100%;
            padding: 12px 36px 12px 38px;
            font-size: 15px;
            color: var(--mac-text-primary);
            background-color: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--mac-card-border);
            border-radius: 10px;
            outline: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .search-input::placeholder {
            color: var(--mac-text-secondary);
            font-size: 14px;
        }

        .search-input:focus {
            border-color: var(--mac-accent);
            background-color: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 3px var(--mac-accent-glow), inset 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--mac-text-secondary);
            font-size: 14px;
            pointer-events: none;
        }

        .clear-btn {
            position: absolute;
            right: 10px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 12px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stats-bar {
            margin-top: 10px;
            font-size: 12px;
            color: var(--mac-text-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 600px;
            padding: 0 2px;
        }

        /* 主容器：寬版排版以容納資料表格 */
        .app-container {
            padding: 20px 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* 表格容器與樣式 */
        .table-wrapper {
            background: var(--mac-card-bg);
            border: 1px solid var(--mac-card-border);
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 14px;
            white-space: nowrap;
        }

        .data-table th, .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid var(--table-border);
        }

        .data-table th {
            background-color: var(--table-header-bg);
            color: #70baff;
            font-weight: 600;
            letter-spacing: 0.5px;
            user-select: none;
        }

        .data-table tbody tr {
            transition: background-color 0.15s ease;
        }

        .data-table tbody tr:hover {
            background-color: var(--table-row-hover);
        }

        .col-center {
            text-align: center;
        }

        .col-right {
            text-align: right;
        }

        .item-name {
            font-weight: 600;
            color: var(--mac-text-primary);
            white-space: normal;
            min-width: 220px;
            line-height: 1.4;
        }

        .remark-cell {
            white-space: normal;
            min-width: 200px;
            max-width: 320px;
            color: var(--mac-text-secondary);
            font-size: 13px;
            line-height: 1.45;
        }

        .price-text {
            color: #64d2ff;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .qty-val {
            color: var(--mac-qty-text);
            font-weight: 600;
        }

        .empty-dash {
            color: rgba(255, 255, 255, 0.25);
            font-weight: 400;
        }

            font-size: 11px;
            background: rgba(10, 132, 255, 0.15);
            color: #64d2ff;
            padding: 2px 6px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 2px;
        }

        .warning-tag {
            color: var(--mac-warning);
            background-color: var(--mac-warning-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 500;
            display: inline-block;
            margin-top: 2px;
        }

        .no-result {
            text-align: center;
            padding: 60px 20px;
            color: var(--mac-text-secondary);
        }

        .no-result-icon {
            font-size: 42px;
            margin-bottom: 12px;
            opacity: 0.8;

        .notice {
            margin-bottom: 14px;
            padding: 10px 14px;
            font-size: 13px;
            color: var(--mac-text-primary);
            background: var(--mac-accent-glow);

// 正則跳脫輔助
function escapeRegExp(string) {
    return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// 移除空格、底線、連字號以進行型號容錯比對
function normalizeModelText(text) {
    if (!text) return '';
    return text.toLowerCase().replace(/[\s\-_/\\()（）.,:;+]/g, '');
}

// 動態資料彙整演算法：將各場館獨立紀錄合併為同一筆
function groupEquipmentData(items) {
    const map = new Map();

    items.forEach(item => {
        // 去除器材名稱後方的 (GT), (GP), (BB) 標記作為分組 Key
        const cleanName = item.name.replace(/\s*\((GT|GP|BB)\)\s*$/, '').trim();

        if (!map.has(cleanName)) {
            map.set(cleanName, {
                name: cleanName,
                gt: '—',
                gp: '—',
                bb: '—',
                shared: null,
                sharedLabel: '',
                venueText: '',
                unit: item.unit,
                price: item.price,
                remark: item.remark
            });
        }

        const record = map.get(cleanName);
        record.venueText += ' ' + item.venue;

        // 依據場館塞入對應欄位
        if (item.venue.includes('GT') || item.venue.includes('大劇院')) {
            record.gt = item.qty;
        } else if (item.venue.includes('GP') || item.venue.includes('球劇場')) {
            record.gp = item.qty;
        } else if (item.venue.includes('BB') || item.venue.includes('藍盒子')) {
            record.bb = item.qty;
        } else {
            // 三館共用或共用設備
            record.shared = item.qty;
            record.sharedLabel = item.venue;
        }
    });

    return Array.from(map.values());
}

// 單一詞彙比對邏輯 (含極短詞邊界保護)
function matchSingleToken(token, textToSearch, normalizedTarget) {
    const rawToken = token.trim();
    if (!rawToken) return true;

    // 極短詞邊界保護 (<= 2 字元，例如 DI)
    if (/^[a-zA-Z0-9]{1,2}$/i.test(rawToken)) {
        const regex = new RegExp(`(?<![a-zA-Z0-9])${escapeRegExp(rawToken)}(?![a-zA-Z0-9])`, 'i');
        return regex.test(textToSearch);
    }

    if (textToSearch.toLowerCase().includes(rawToken.toLowerCase())) {
        return true;
    }

    const normToken = normalizeModelText(rawToken);
    return normToken.length > 0 && normalizedTarget.includes(normToken);
}

function stripTags(t) { return String(t).replace(/<[^>]+>/g, ''); }
const groupedAll = groupEquipmentData(equipmentData);

// 搜尋演算法
function performSearch() {
    const searchInput = document.getElementById('searchInput');
    const rawQuery = searchInput.value.trim();
    const clearBtn = document.getElementById('clearBtn');
    
    clearBtn.style.display = rawQuery.length > 0 ? 'flex' : 'none';

    if (!rawQuery) {
        renderTable(groupedAll);
        return;
    }

    const tokens = rawQuery.split(/\s+/).filter(t => t.length > 0);

    const filtered = groupedAll.filter(item => {
        const textToSearch = `${item.name} ${item.venueText} ${stripTags(item.remark)}`;
        const normalizedTarget = normalizeModelText(textToSearch);

        // 單詞為極短縮寫 (如 DI)
        if (tokens.length === 1 && /^[a-zA-Z0-9]{1,2}$/i.test(tokens[0])) {
            return matchSingleToken(tokens[0], textToSearch, normalizedTarget);
        }

        // 型號容錯 (如 "SM 58", "M32 R")
        const fullNormalizedQuery = normalizeModelText(rawQuery);
        if (fullNormalizedQuery.length > 2 && normalizedTarget.includes(fullNormalizedQuery)) {
            return true;
        }

        // 多條件交集比對
        return tokens.every(token => matchSingleToken(token, textToSearch, normalizedTarget));
    });

    renderTable(filtered);
}

// 渲染表格內容
function renderTable(groupedData) {
    const tbody = document.getElementById('tableBody');
    const resultCount = document.getElementById('resultCount');

    resultCount.textContent = `共 ${groupedData.length} 項彙整設備`;

    if (groupedData.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="no-result">
                    <div class="no-result-icon">💻</div>
                    <div style="font-size: 15px; font-weight: 500;">未找到符合的設備</div>
                    <div style="font-size: 12px; margin-top: 6px; opacity: 0.6;">請嘗試搜尋其他型號或關鍵字</div>
                </td>
            </tr>
        `;
        return;
    }

    tbody.innerHTML = groupedData.map(item => {
        let venueCells = '';

        if (item.shared) {
            // 三館共用設備跨欄展示
            venueCells = `
                <td colspan="3" class="col-center">
                    <span class="shared-tag">${item.sharedLabel}</span><br>
                    <span class="qty-val">${item.shared}</span>
                </td>
            `;
        } else {
            // 分館獨立展示 GT, GP, BB
            const renderQty = (val) => val === '—' 
                ? `<span class="empty-dash">—</span>` 
                : `<span class="qty-val">${val}</span>`;

            venueCells = `
                <td class="col-center">${renderQty(item.gt)}</td>
                <td class="col-center">${renderQty(item.gp)}</td>
                <td class="col-center">${renderQty(item.bb)}</td>
            `;
        }

        return `
            <tr>
                <td class="item-name">${item.name}</td>
                ${venueCells}
                <td class="col-center">${item.unit}</td>
                <td class="col-right price-text">${item.price}</td>
                <td class="remark-cell">${item.remark}</td>
            </tr>
        `;
    }).join('');
}

// 清除按鈕
function clearSearch() {
    const searchInput = document.getElementById('searchInput');
    searchInput.value = '';
    performSearch();
    searchInput.focus();
}

document.getElementById('searchInput').addEventListener('input', performSearch);

// 初始化渲染
performSearch();
